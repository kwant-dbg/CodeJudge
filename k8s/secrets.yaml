apiVersion: v1
kind: Secret
metadata:
  name: codejudge-secrets
  namespace: codejudge
type: Opaque
stringData:
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "password"
  POSTGRES_DB: "codejudgedb"
  DATABASE_URL: "postgres://user:password@postgres-service:5432/codejudgedb?sslmode=disable"
  REDIS_URL: "redis://redis-service:6379"
