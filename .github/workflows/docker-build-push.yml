name: Build and Push Docker Images

on:
  push:
    branches:
      - mono
      - main
    paths:
      - 'monolith/**'
      - 'judge/**'
      - 'common/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    branches:
      - mono
      - main
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to registry'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/codejudge

jobs:
  build-monolith:
    name: Build Monolith Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-monolith
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/codejudge-monolith', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Monolith image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./monolith/Dockerfile.standalone
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_images != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  build-judge:
    name: Build Judge Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-judge
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/codejudge-judge', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Judge image
        uses: docker/build-push-action@v5
        with:
          context: ./judge
          file: ./judge/Dockerfile.modern
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_images != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  test-images:
    name: Test Docker Images
    needs: [build-monolith, build-judge]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event.inputs.push_images == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-monolith:${{ github.ref_name }}-${{ github.sha }}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-judge:${{ github.ref_name }}-${{ github.sha }}

      - name: Create docker-compose test file
        run: |
          cat > docker-compose.test.yml <<EOF
          services:
            db:
              image: postgres:14-alpine
              environment:
                POSTGRES_USER: testuser
                POSTGRES_PASSWORD: testpass
                POSTGRES_DB: testdb
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
                interval: 5s
                timeout: 5s
                retries: 5

            redis:
              image: redis:7-alpine
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 5s
                timeout: 5s
                retries: 5

            monolith:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-monolith:${{ github.ref_name }}-${{ github.sha }}
              ports:
                - "8080:8080"
              depends_on:
                db:
                  condition: service_healthy
                redis:
                  condition: service_healthy
              environment:
                - DATABASE_URL=postgres://testuser:testpass@db:5432/testdb?sslmode=disable
                - REDIS_URL=redis://redis:6379
                - JWT_SECRET=test-jwt-secret
                - PORT=8080
              healthcheck:
                test: ["CMD", "/app/codejudge-monolith", "-health-check"]
                interval: 10s
                timeout: 5s
                retries: 5
          EOF

      - name: Start services
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30

      - name: Wait for monolith health check
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8080/health; then
              echo "Monolith service is healthy!"
              exit 0
            fi
            echo "Waiting for monolith... (attempt $i/30)"
            sleep 5
          done
          echo "Monolith service failed to become healthy"
          docker-compose -f docker-compose.test.yml logs
          exit 1

      - name: Test API endpoints
        run: |
          # Test health endpoint
          curl -f http://localhost:8080/health || exit 1
          
          # Test ready endpoint
          curl -f http://localhost:8080/ready || exit 1
          
          # Test register endpoint
          curl -f -X POST http://localhost:8080/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"testuser","email":"test@example.com","password":"testpass123"}' || exit 1
          
          echo "All API tests passed!"

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down -v

  security-scan:
    name: Security Scan
    needs: [build-monolith, build-judge]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    
    strategy:
      matrix:
        image: [monolith, judge]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.ref_name }}-${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.ref_name }}-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  summary:
    name: Build Summary
    needs: [build-monolith, build-judge, test-images, security-scan]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Built:" >> $GITHUB_STEP_SUMMARY
          echo "- Monolith: \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-monolith:${{ github.ref_name }}-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Judge: \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-judge:${{ github.ref_name }}-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Deploy:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-monolith:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-judge:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
