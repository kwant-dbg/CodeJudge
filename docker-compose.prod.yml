# Production Docker Compose Configuration
# Uses pre-built images from GitHub Container Registry
# 
# Quick start:
#   1. Copy this file: cp docker-compose.prod.yml docker-compose.override.yml
#   2. Edit environment variables as needed
#   3. Run: docker-compose up -d

services:
  monolith:
    image: ghcr.io/kwant-dbg/codejudge-monolith:latest
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/codejudgedb?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - PORT=8080
      - GIN_MODE=release
      - PLAGIARISM_MAX_COMPARISONS=${PLAGIARISM_MAX_COMPARISONS:-1000}
      - PLAGIARISM_SIMILARITY_THRESHOLD=${PLAGIARISM_SIMILARITY_THRESHOLD:-0.8}
      # Admin user auto-creation (optional - set in .env file)
      # WARNING: Never commit real credentials to Git!
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/codejudge-monolith", "-health-check"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-codejudgedb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-codejudgedb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  judge:
    image: ghcr.io/kwant-dbg/codejudge-judge:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-codejudgedb}?sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TIME_LIMIT=${TIME_LIMIT:-5}
      - MEMORY_LIMIT=${MEMORY_LIMIT:-256}
      - SANDBOX_USER=sandbox_user
      - ENABLE_SANDBOX=true
    restart: unless-stopped
    # Security hardened: Use minimal capabilities instead of privileged mode
    cap_add:
      - SYS_ADMIN      # Required for unshare() namespace creation
      - SYS_CHROOT     # Required for chroot jails
      - SETUID         # Required for setuid/setgid to drop privileges
      - SETGID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=default
    volumes:
      - judge_submissions:/app/submissions
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

volumes:
  postgres_data:
  redis_data:
  judge_submissions:
