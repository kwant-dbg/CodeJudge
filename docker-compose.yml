services:
  monolith:
    # Option 1: Build locally (for development)
    build:
      context: .
      dockerfile: monolith/Dockerfile.standalone
    
    # Option 2: Use pre-built image from CI/CD (for production)
    # image: ghcr.io/kwant-dbg/codejudge-monolith:latest
    
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/codejudgedb?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-jwt-secret-key-change-in-production
      - PORT=8080
      - GIN_MODE=release
      - PLAGIARISM_MAX_COMPARISONS=1000
      - PLAGIARISM_SIMILARITY_THRESHOLD=0.8
      # Admin user auto-creation (optional - uncomment and set to enable)
      # WARNING: Do not commit real credentials! Use .env file (not in Git)
      # - ADMIN_USERNAME=admin
      # - ADMIN_EMAIL=admin@example.com
      # - ADMIN_PASSWORD=change-this-strong-password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/codejudge-monolith", "-health-check"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: codejudgedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d codejudgedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  judge:
    # Option 1: Build locally (for development)
    build:
      context: ./judge
      dockerfile: Dockerfile.modern
    
    # Option 2: Use pre-built image from CI/CD (for production)
    # image: ghcr.io/kwant-dbg/codejudge-judge:latest
    
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/codejudgedb?sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TIME_LIMIT=5
      - MEMORY_LIMIT=256
      - SANDBOX_USER=sandbox_user
      - ENABLE_SANDBOX=true
    restart: unless-stopped
    # Security hardened: Use minimal capabilities instead of privileged mode
    cap_add:
      - SYS_ADMIN      # Required for unshare() namespace creation
      - SYS_CHROOT     # Required for chroot jails
      - SETUID         # Required for setuid/setgid to drop privileges
      - SETGID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=default
    volumes:
      - judge_submissions:/app/submissions
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

volumes:
  postgres_data:
  redis_data:
  judge_submissions:

