<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Details - CodeJudge</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #fafafa;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --accent: #1a1a1a;
            --accent-hover: #333333;
            --card-bg: #ffffff;
        }
        
        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #282828;
            --text-primary: #eff1f6;
            --text-secondary: #a0a0a0;
            --border-color: #3a3a3a;
            --accent: #eff1f6;
            --accent-hover: #d0d0d0;
            --card-bg: #262626;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; 
            background: var(--bg-primary); 
            color: var(--text-primary); 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .header { background: var(--card-bg); color: var(--text-primary); padding: 10px 0; border-bottom: 1px solid var(--border-color); transition: all 0.3s ease; }
        .header-content { max-width: 1200px; margin: 0 auto; padding: 0 32px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 600; text-decoration: none; color: var(--text-primary); letter-spacing: -1px; transition: color 0.3s ease; }
        .nav-links a { color: var(--text-primary); text-decoration: none; padding: 0; font-weight: 500; font-size: 13px; letter-spacing: 0.3px; transition: opacity 0.2s; }
        .nav-links a:hover { opacity: 0.6; }

        .container { max-width: 1200px; margin: 24px auto; padding: 0 32px; }
        h1 { font-size: 28px; font-weight: 600; letter-spacing: -1px; margin-bottom: 24px; }

        #submissionContainer { 
            background: var(--card-bg);
            padding: 24px;
            border: 1px solid var(--border-color);
        }

        pre { 
            background: var(--bg-secondary);
            padding: 16px;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <a href="/" class="logo">CodeJudge</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/plagiarism.html">Plagiarism Reports</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>Submission Details</h1>
        <div id="submissionContainer">
            <p>Loading submission details...</p>
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem('authToken');
        let submissionId = null;

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            submissionId = urlParams.get('id');

            if (authToken && submissionId) {
                loadSubmission();
            } else {
                document.getElementById('submissionContainer').innerHTML = '<p>You must be logged in to view this page.</p>';
            }
        });

        async function loadSubmission() {
            try {
                const response = await fetch(`/api/submissions/${submissionId}`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load submission.');
                }

                const submission = await response.json();
                displaySubmission(submission);

            } catch (err) {
                document.getElementById('submissionContainer').innerHTML = `<p>${err.message}</p>`;
            }
        }

        function displaySubmission(submission) {
            const container = document.getElementById('submissionContainer');
            container.innerHTML = `
                <p><strong>Submission ID:</strong> ${submission.id}</p>
                <p><strong>Problem ID:</strong> ${submission.problem_id}</p>
                <p><strong>User ID:</strong> ${submission.user_id}</p>
                <p><strong>Language:</strong> ${submission.language}</p>
                <p><strong>Verdict:</strong> ${submission.verdict}</p>
                <p><strong>Submitted At:</strong> ${new Date(submission.created_at).toLocaleString()}</p>
                <h3>Source Code</h3>
                <pre><code>${submission.source_code}</code></pre>
            `;
        }

        // Theme initialization
        (function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</body>
</html>
