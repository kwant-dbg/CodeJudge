<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem - CodeJudge</title>
    <!-- KaTeX for LaTeX rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #fafafa;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --accent: #1a1a1a;
            --accent-hover: #333333;
            --card-bg: #ffffff;
        }
        
        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #282828;
            --text-primary: #eff1f6;
            --text-secondary: #a0a0a0;
            --border-color: #3a3a3a;
            --accent: #eff1f6;
            --accent-hover: #d0d0d0;
            --card-bg: #262626;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; 
            background: var(--bg-primary); 
            color: var(--text-primary); 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Header */
        .header { background: var(--card-bg); color: var(--text-primary); padding: 10px 0; border-bottom: 1px solid var(--border-color); transition: all 0.3s ease; }
        .header-content { max-width: 100%; margin: 0 auto; padding: 0 32px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 600; text-decoration: none; color: var(--text-primary); letter-spacing: -1px; transition: color 0.3s ease; }
        .nav-links { display: flex; gap: 16px; align-items: center; }
        .nav-links a { color: var(--text-primary); text-decoration: none; padding: 0; font-weight: 500; font-size: 13px; letter-spacing: 0.3px; transition: opacity 0.2s; }
        .nav-links a:hover { opacity: 0.6; }
        .theme-toggle {
            background: var(--accent);
            color: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 0;
            cursor: pointer;
            font-size: 18px;
            border-radius: 4px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }
        .theme-toggle:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }
        #userInfo {
            background: var(--accent); 
            color: var(--bg-primary); 
            padding: 8px 14px; 
            font-weight: 600; 
            font-size: 13px; 
            letter-spacing: 0.3px;
            border-radius: 4px;
            white-space: nowrap;
        }
        
        /* Main content */
        .container { max-width: 100%; margin: 0; padding: 0; }
        .breadcrumb { color: var(--text-secondary); margin-bottom: 0; font-size: 12px; padding: 8px 32px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); transition: all 0.3s ease; }
        .breadcrumb a { color: var(--text-primary); text-decoration: none; font-weight: 500; transition: color 0.3s ease; }
        .breadcrumb a:hover { opacity: 0.6; }
        
        .main-content { display: grid; grid-template-columns: 1fr 480px; gap: 0; }
        
        /* Problem Section */
        .problem-section { background: var(--card-bg); color: var(--text-primary); padding: 24px 32px; border-right: 1px solid var(--border-color); min-height: calc(100vh - 120px); transition: all 0.3s ease; }
        .problem-header { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); transition: border-color 0.3s ease; }
        .problem-title { font-size: 24px; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; letter-spacing: -1px; line-height: 1.2; transition: color 0.3s ease; }
        .problem-meta { display: flex; gap: 12px; align-items: center; }
        .badge { display: inline-block; padding: 3px 10px; font-size: 10px; font-weight: 600; border: 1px solid var(--accent); letter-spacing: 0.3px; border-radius: 3px; transition: all 0.3s ease; }
        .badge-easy { background: var(--bg-primary); color: #00b8a3; border-color: #00b8a3; }
        .badge-medium { background: var(--bg-primary); color: #ffa116; border-color: #ffa116; }
        .badge-hard { background: var(--bg-primary); color: #ef4743; border-color: #ef4743; }
        .problem-id { color: var(--text-secondary); font-size: 12px; font-weight: 400; transition: color 0.3s ease; }
        
        .problem-description { line-height: 1.8; color: var(--text-primary); font-size: 14px; transition: color 0.3s ease; }
        .problem-description h3 { margin-top: 24px; margin-bottom: 12px; color: var(--text-primary); font-weight: 600; font-size: 18px; letter-spacing: -0.5px; transition: color 0.3s ease; }
        .problem-description p { margin-bottom: 16px; line-height: 1.8; }
        .problem-description ul, .problem-description ol { margin-left: 20px; margin-bottom: 12px; }
        .problem-description code { background: var(--bg-secondary); color: var(--text-primary); padding: 2px 6px; font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; font-size: 13px; border: 1px solid var(--border-color); transition: all 0.3s ease; }
        .problem-description strong { color: var(--text-primary); font-weight: 600; transition: color 0.3s ease; }
        
        /* Enhanced KaTeX/Math styling */
        .problem-description .katex { font-size: 1.1em; }
        .problem-description .katex-display { margin: 1.5em 0; overflow-x: auto; overflow-y: hidden; }
        .problem-description .katex-display > .katex { display: inline-block; white-space: nowrap; max-width: 100%; }
        .problem-description .katex .katex-html { color: var(--text-primary); }
        
        /* Dark mode KaTeX adjustments */
        [data-theme="dark"] .katex { color: var(--text-primary); }
        [data-theme="dark"] .katex .mord, 
        [data-theme="dark"] .katex .mbin,
        [data-theme="dark"] .katex .mrel,
        [data-theme="dark"] .katex .mop,
        [data-theme="dark"] .katex .mopen,
        [data-theme="dark"] .katex .mclose,
        [data-theme="dark"] .katex .mpunct { color: var(--text-primary) !important; }
        
        /* Codeforces-style sections */
        .info-section { 
            margin-bottom: 24px; 
            margin-top: 24px;
        }
        .section-title { 
            font-size: 16px; 
            font-weight: 600; 
            color: var(--text-primary); 
            margin-bottom: 12px; 
            letter-spacing: -0.3px;
            transition: color 0.3s ease;
        }
        .section-content { 
            background: var(--bg-secondary); 
            padding: 16px; 
            border: 1px solid var(--border-color); 
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .section-content p { margin-bottom: 8px; line-height: 1.6; }
        .section-content p:last-child { margin-bottom: 0; }
        
        /* Sample test cases */
        .sample-tests { margin-top: 24px; }
        .sample-test { 
            margin-bottom: 20px; 
            border: 1px solid var(--border-color); 
            border-radius: 4px; 
            overflow: hidden;
            transition: border-color 0.3s ease;
        }
        .sample-test-header {
            background: var(--bg-secondary);
            padding: 8px 16px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
        }
        .sample-test-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }
        .sample-io {
            padding: 0;
        }
        .sample-io-label {
            background: var(--bg-secondary);
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .sample-io-content {
            padding: 12px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 13px;
            line-height: 1.6;
            background: var(--card-bg);
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
            transition: all 0.3s ease;
        }
        .sample-io:first-child {
            border-right: 1px solid var(--border-color);
        }
        
        /* Notes section */
        .note-section {
            background: #fffbea;
            border: 1px solid #f5d547;
            border-left: 4px solid #f5d547;
            padding: 16px;
            margin-top: 24px;
            border-radius: 4px;
        }
        [data-theme="dark"] .note-section {
            background: rgba(245, 213, 71, 0.1);
            border-color: #f5d547;
        }
        .note-section .section-title {
            color: #856404;
            margin-bottom: 8px;
        }
        [data-theme="dark"] .note-section .section-title {
            color: #f5d547;
        }
        
        @media (max-width: 768px) {
            .sample-test-body {
                grid-template-columns: 1fr;
            }
            .sample-io:first-child {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
        }
        
        /* Submission Panel */
        .submission-panel { background: var(--card-bg); color: var(--text-primary); padding: 24px 24px; height: fit-content; position: sticky; top: 0; transition: all 0.3s ease; }
        .submission-panel h3 { margin-bottom: 16px; color: var(--text-primary); font-size: 18px; font-weight: 600; letter-spacing: -0.5px; transition: color 0.3s ease; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--text-primary); font-size: 12px; letter-spacing: 0.5px; transition: color 0.3s ease; }
        select, textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); font-size: 14px; font-family: inherit; background: var(--bg-secondary); color: var(--text-primary); transition: all 0.3s ease; }
        textarea { font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; resize: vertical; min-height: 280px; line-height: 1.5; }
        select:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--card-bg); }
        button { width: 100%; background: var(--accent); color: var(--bg-primary); padding: 12px; border: 1px solid var(--accent); cursor: pointer; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; font-family: inherit; transition: all 0.3s ease; }
        button:hover { background: var(--bg-primary); color: var(--accent); }
        button:disabled { background: var(--text-secondary); cursor: not-allowed; opacity: 0.5; }
        
        .submission-result { margin-top: 16px; padding: 14px; border: 1px solid #000; display: none; font-size: 13px; }
        .submission-result.success { background: #000; color: #fff; }
        .submission-result.error { background: #d00; color: #fff; border-color: #d00; }
        .submission-result.pending { background: var(--bg-secondary); color: var(--text-primary); transition: all 0.3s ease; }
        
        .verdict { font-size: 14px; font-weight: 600; margin-top: 12px; padding: 12px; text-align: center; border: 1px solid var(--accent); transition: all 0.3s ease; }
        .verdict-accepted { background: var(--accent); color: var(--bg-primary); }
        .verdict-rejected { background: #d00; color: #fff; border-color: #d00; }
        .verdict-pending { background: var(--bg-secondary); color: var(--text-primary); }
        
        .login-required { text-align: center; padding: 40px 24px; color: var(--text-secondary); transition: color 0.3s ease; }
        .login-required a { color: var(--text-primary); text-decoration: none; font-weight: 600; border-bottom: 1px solid var(--accent); transition: all 0.3s ease; }
        .login-required a:hover { opacity: 0.6; }
        
        .hidden { display: none !important; }
        
        @media (max-width: 968px) {
            .main-content { grid-template-columns: 1fr; }
            .submission-panel { position: relative; top: 0; }
            .header-content, .breadcrumb, .problem-section, .submission-panel { padding-left: 20px; padding-right: 20px; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <a href="/" class="logo">CodeJudge</a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/#problemsTab">Problems</a>
                <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
                    <span id="themeIcon">🌙</span>
                </button>
                <span id="userInfo"></span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="breadcrumb">
            <a href="/">Home</a> / <a href="/#problemsTab">Problems</a> / <span id="breadcrumbTitle">Loading...</span>
        </div>

        <div class="main-content">
            <!-- Problem Description -->
            <div class="problem-section">
                <div id="problemContent">
                    <div style="text-align: center; padding: 60px 20px; color: #999;">
                        <div style="font-size: 48px; margin-bottom: 20px;">⏳</div>
                        <p>Loading problem...</p>
                    </div>
                </div>
            </div>

            <!-- Submission Panel -->
            <div class="submission-panel">
                <h3>Submit Solution</h3>
                <div id="submissionForm" class="hidden">
                    <div class="form-group">
                        <label>Language</label>
                        <select id="language">
                            <option value="cpp">C++</option>
                            <option value="python">Python</option>
                            <option value="java">Java</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Your Code</label>
                        <textarea id="code" placeholder="Write your solution here..."></textarea>
                    </div>
                    <button id="submitBtn" onclick="submitSolution()">Submit Solution</button>
                    <div id="submissionResult" class="submission-result"></div>
                </div>
                <div id="loginRequired" class="login-required">
                    <p>Please <a href="/">login</a> to submit solutions</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem('authToken');
        let currentUser = null;
        let problemId = null;

        // Debug logging
        console.log('Auth Token from localStorage:', authToken);
        console.log('Token exists?', !!authToken);

        // Parse structured problem description
        function parseStructuredDescription(description) {
            const result = {
                mainDescription: '',
                inputSection: '',
                outputSection: '',
                examplesSection: ''
            };

            console.log('Parsing description:', description);

            // Check if description uses structured format
            if (!description.includes('---INPUT---')) {
                // Legacy format - return as is
                console.log('Using legacy format');
                result.mainDescription = description;
                return result;
            }

            console.log('Using structured format');

            // Normalize line endings
            description = description.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            
            // Split by sections
            const parts = description.split(/---([A-Z]+)---/);
            result.mainDescription = parts[0].trim();

            let currentSection = null;
            let inputContent = '';
            let outputContent = '';
            let examplesContent = '';

            for (let i = 1; i < parts.length; i += 2) {
                const sectionName = parts[i];
                const sectionContent = parts[i + 1] ? parts[i + 1].trim() : '';

                if (sectionName === 'INPUT') {
                    inputContent = sectionContent;
                    console.log('Found INPUT:', inputContent);
                } else if (sectionName === 'OUTPUT') {
                    outputContent = sectionContent;
                    console.log('Found OUTPUT:', outputContent);
                } else if (sectionName === 'EXAMPLES') {
                    examplesContent = sectionContent;
                    console.log('Found EXAMPLES:', examplesContent);
                }
            }

            console.log('Final sections:', { inputContent, outputContent, examplesContent });

            // Build Input section
            if (inputContent) {
                // Keep content as-is to preserve inline LaTeX, just wrap paragraphs
                const inputParagraphs = inputContent.split('\n\n').filter(p => p.trim());
                result.inputSection = `
                    <div class="info-section">
                        <div class="section-title">Input</div>
                        <div class="section-content">
                            ${inputParagraphs.map(para => `<p>${para.replace(/\n/g, ' ').trim()}</p>`).join('')}
                        </div>
                    </div>
                `;
                console.log('Input section created:', result.inputSection);
            }

            // Build Output section
            if (outputContent) {
                // Keep content as-is to preserve inline LaTeX, just wrap paragraphs
                const outputParagraphs = outputContent.split('\n\n').filter(p => p.trim());
                result.outputSection = `
                    <div class="info-section">
                        <div class="section-title">Output</div>
                        <div class="section-content">
                            ${outputParagraphs.map(para => `<p>${para.replace(/\n/g, ' ').trim()}</p>`).join('')}
                        </div>
                    </div>
                `;
                console.log('Output section created:', result.outputSection);
            }

            // Build Examples section
            if (examplesContent) {
                const examples = examplesContent.split(/###EXAMPLE\d+###/).filter(e => e.trim());
                let examplesHtml = '<div class="sample-tests">';
                
                examples.forEach((example, index) => {
                    const lines = example.trim().split('\n');
                    let input = '';
                    let output = '';
                    let note = '';

                    lines.forEach(line => {
                        const trimmed = line.trim();
                        if (trimmed.startsWith('INPUT:')) {
                            input = trimmed.substring(6).trim();
                        } else if (trimmed.startsWith('OUTPUT:')) {
                            output = trimmed.substring(7).trim();
                        } else if (trimmed.startsWith('NOTE:')) {
                            note = trimmed.substring(5).trim();
                        }
                    });

                    if (input || output) {
                        examplesHtml += `
                            <div class="sample-test">
                                <div class="sample-test-header">Example ${index + 1}</div>
                                <div class="sample-test-body">
                                    <div class="sample-io">
                                        <div class="sample-io-label">INPUT</div>
                                        <div class="sample-io-content">${input}</div>
                                    </div>
                                    <div class="sample-io">
                                        <div class="sample-io-label">OUTPUT</div>
                                        <div class="sample-io-content">${output}</div>
                                    </div>
                                </div>
                                ${note ? `<div class="note-section"><div class="section-title">Note</div><p>${note}</p></div>` : ''}
                            </div>
                        `;
                    }
                });

                examplesHtml += '</div>';
                result.examplesSection = examplesHtml;
                console.log('Examples section created:', result.examplesSection);
            }

            console.log('Returning result:', result);
            return result;
        }

        // Helper function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Get problem ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        problemId = urlParams.get('id');

        if (!problemId) {
            document.getElementById('problemContent').innerHTML = `
                <div style="text-align: center; padding: 60px 20px; color: #dc3545;">
                    <div style="font-size: 48px; margin-bottom: 20px;">❌</div>
                    <h2>Problem not found</h2>
                    <p style="margin-top: 10px;">The problem ID is missing from the URL.</p>
                    <a href="/" style="color: #007bff; text-decoration: none; font-weight: 600;">← Back to Home</a>
                </div>
            `;
        }

        async function loadProblem() {
            if (!problemId) return;

            try {
                const response = await fetch(`/api/problems/${problemId}`);
                if (!response.ok) {
                    throw new Error('Problem not found');
                }
                const problem = await response.json();
                
                document.title = `${problem.title} - CodeJudge`;
                document.getElementById('breadcrumbTitle').textContent = problem.title;
                
                const difficultyClass = problem.difficulty === 'easy' ? 'badge-easy' : 
                                       problem.difficulty === 'medium' ? 'badge-medium' : 'badge-hard';
                
                // Process description with structured format support
                let desc = problem.description || 'No description provided.';
                
                // Parse structured format
                const parsed = parseStructuredDescription(desc);
                
                // Generate sample test cases HTML
                let sampleTestsHtml = '';
                console.log('Problem test_cases:', problem.test_cases);
                if (problem.test_cases && problem.test_cases.length > 0) {
                    const sampleTests = problem.test_cases.filter(tc => tc.sample === true);
                    console.log('Filtered sample tests:', sampleTests);
                    if (sampleTests.length > 0) {
                        sampleTestsHtml = '<div class="sample-tests"><div class="section-title">Sample Tests</div>';
                        sampleTests.forEach((test, index) => {
                            sampleTestsHtml += `
                                <div class="sample-test">
                                    <div class="sample-test-header">Example ${index + 1}</div>
                                    <div class="sample-test-body">
                                        <div class="sample-io">
                                            <div class="sample-io-label">INPUT</div>
                                            <div class="sample-io-content">${escapeHtml(test.input)}</div>
                                        </div>
                                        <div class="sample-io">
                                            <div class="sample-io-label">OUTPUT</div>
                                            <div class="sample-io-content">${escapeHtml(test.output)}</div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        sampleTestsHtml += '</div>';
                    }
                }
                
                document.getElementById('problemContent').innerHTML = `
                    <div class="problem-header">
                        <h1 class="problem-title">${problem.title}</h1>
                        <div class="problem-meta">
                            <span class="badge ${difficultyClass}">${problem.difficulty.toUpperCase()}</span>
                            <span class="problem-id">Problem #${problem.id}</span>
                        </div>
                    </div>
                    <div class="problem-description" id="problemDesc">
                        ${parsed.mainDescription}
                    </div>
                    ${parsed.inputSection}
                    ${parsed.outputSection}
                    ${sampleTestsHtml}
                    ${parsed.examplesSection}
                `;
                
                // Apply basic Markdown formatting to all sections (before LaTeX rendering)
                const problemContent = document.getElementById('problemContent');
                const elementsToProcess = problemContent.querySelectorAll('.problem-description, .section-content, .note-section p');
                
                elementsToProcess.forEach(element => {
                    let html = element.innerHTML;
                    
                    // Protect LaTeX expressions from markdown processing
                    const latexProtected = [];
                    let protectIndex = 0;
                    
                    // Temporarily replace LaTeX with placeholders
                    html = html.replace(/\$\$[\s\S]+?\$\$/g, (match) => {
                        latexProtected.push(match);
                        return `___LATEX_DISPLAY_${protectIndex++}___`;
                    });
                    html = html.replace(/\$[^\$\n]+?\$/g, (match) => {
                        latexProtected.push(match);
                        return `___LATEX_INLINE_${protectIndex++}___`;
                    });
                    html = html.replace(/\\\[[\s\S]+?\\\]/g, (match) => {
                        latexProtected.push(match);
                        return `___LATEX_BRACKET_${protectIndex++}___`;
                    });
                    html = html.replace(/\\\([\s\S]+?\\\)/g, (match) => {
                        latexProtected.push(match);
                        return `___LATEX_PAREN_${protectIndex++}___`;
                    });
                    
                    // Now safely process markdown
                    // Convert headings (### h3, ## h2, # h1)
                    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
                    html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>'); // Use h3 for consistency
                    html = html.replace(/^# (.+)$/gm, '<h3>$1</h3>');
                    
                    // Convert unordered lists (lines starting with - or *)
                    html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
                    // Wrap consecutive list items in <ul>
                    html = html.replace(/(<li>.*<\/li>\n?)+/g, (match) => '<ul>' + match + '</ul>');
                    
                    // Convert bold and italic
                    html = html.replace(/\*\*([^\*]+?)\*\*/g, '<strong>$1</strong>');
                    html = html.replace(/(?<!\*)\*(?!\*)([^\*]+?)\*(?!\*)/g, '<em>$1</em>');
                    
                    // Convert backticks to code
                    html = html.replace(/`([^`]+?)`/g, '<code>$1</code>');
                    
                    // Convert line breaks to paragraphs (double newline)
                    html = html.replace(/\n\n+/g, '</p><p>');
                    html = '<p>' + html + '</p>';
                    // Clean up empty paragraphs and misplaced tags
                    html = html.replace(/<p>\s*<\/p>/g, '');
                    html = html.replace(/<p>\s*<h3>/g, '<h3>');
                    html = html.replace(/<\/h3>\s*<\/p>/g, '</h3>');
                    html = html.replace(/<p>\s*<ul>/g, '<ul>');
                    html = html.replace(/<\/ul>\s*<\/p>/g, '</ul>');
                    html = html.replace(/<br>\s*<br>/g, '</p><p>');
                    
                    // Restore LaTeX expressions
                    protectIndex = 0;
                    html = html.replace(/___LATEX_(DISPLAY|INLINE|BRACKET|PAREN)_\d+___/g, () => {
                        return latexProtected[protectIndex++] || '';
                    });
                    
                    element.innerHTML = html;
                });
                
                // Render LaTeX after Markdown with enhanced error handling
                // Wait for KaTeX auto-render to load
                const renderMath = () => {
                    if (typeof renderMathInElement !== 'undefined') {
                        try {
                            // Render LaTeX in all problem sections
                            renderMathInElement(problemContent, {
                                delimiters: [
                                    {left: '$$', right: '$$', display: true},
                                    {left: '\\[', right: '\\]', display: true},
                                    {left: '\\(', right: '\\)', display: false},
                                    // Single $ for inline, but process last to avoid conflicts
                                    {left: '$', right: '$', display: false}
                                ],
                                throwOnError: false,
                                errorColor: '#cc0000',
                                strict: false,
                                trust: true,
                                fleqn: false,
                                ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                                ignoredClasses: ['no-katex'],
                                // Preprocess function to handle edge cases
                                preProcess: (math) => {
                                    // Ensure proper spacing
                                    return math.trim();
                                }
                            });
                            console.log('KaTeX rendering completed successfully');
                        } catch (e) {
                            console.error('KaTeX rendering error:', e);
                        }
                    } else {
                        // Retry after a short delay if KaTeX isn't loaded yet
                        console.log('Waiting for KaTeX to load...');
                        setTimeout(renderMath, 100);
                    }
                };
                
                // Start rendering after a brief delay to ensure DOM is ready
                setTimeout(renderMath, 50);
                
            } catch (err) {
                document.getElementById('problemContent').innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: #dc3545;">
                        <div style="font-size: 48px; margin-bottom: 20px;">❌</div>
                        <h2>Problem not found</h2>
                        <p style="margin-top: 10px;">${err.message}</p>
                        <a href="/" style="display: inline-block; margin-top: 20px; color: #007bff; text-decoration: none; font-weight: 600;">← Back to Home</a>
                    </div>
                `;
            }
        }

        async function validateToken() {
            console.log('validateToken() called');
            try {
                console.log('Sending validation request with token:', authToken?.substring(0, 20) + '...');
                const response = await fetch('/api/auth/validate', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                console.log('Validation response status:', response.status);
                if (response.ok) {
                    const data = await response.json();
                    console.log('Validation successful, data:', data);
                    // The API returns claims directly, not wrapped in { user: {...} }
                    currentUser = { username: data.username, user_id: data.user_id, role: data.role };
                    document.getElementById('userInfo').textContent = `👤 ${currentUser.username}`;
                    document.getElementById('submissionForm').classList.remove('hidden');
                    document.getElementById('loginRequired').classList.add('hidden');
                } else {
                    // Token invalid, but don't remove it - user might have just logged out elsewhere
                    console.log('Token validation failed:', response.status);
                    showLoginRequired();
                }
            } catch (err) {
                console.error('Token validation error:', err);
                showLoginRequired();
            }
        }

        function showLoginRequired() {
            console.log('showLoginRequired() called');
            document.getElementById('userInfo').textContent = 'Guest';
            document.getElementById('submissionForm').classList.add('hidden');
            document.getElementById('loginRequired').classList.remove('hidden');
        }

        async function submitSolution() {
            const code = document.getElementById('code').value.trim();
            const language = document.getElementById('language').value;
            const resultDiv = document.getElementById('submissionResult');
            const submitBtn = document.getElementById('submitBtn');

            if (!code) {
                resultDiv.className = 'submission-result error';
                resultDiv.style.display = 'block';
                resultDiv.textContent = 'Please write some code before submitting!';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            resultDiv.className = 'submission-result pending';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '⏳ Submitting your solution...';

            try {
                const response = await fetch('/api/submissions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({
                        problem_id: parseInt(problemId),
                        language: language,
                        source_code: code
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    resultDiv.className = 'submission-result success';
                    resultDiv.innerHTML = `
                        <h3 style="color: #28a745; margin-bottom: 10px;">✓ Submission Received</h3>
                        <p><strong>Submission ID:</strong> ${result.id}</p>
                        <p><strong>Problem ID:</strong> ${result.problem_id}</p>
                        <p><strong>Language:</strong> ${result.language || 'cpp'}</p>
                        <p><strong>Status:</strong> <span id="submissionStatus">Pending</span></p>
                        <p id="verdictText" style="margin-top: 10px; color: #666;">Your solution is being evaluated...</p>
                        <button onclick="checkSubmissionStatus(${result.id})" style="margin-top: 10px; padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Check Status</button>
                    `;
                    document.getElementById('code').value = '';
                    
                    // Auto-poll for status every 2 seconds
                    pollSubmissionStatus(result.id);
                } else {
                    const error = await response.json();
                    resultDiv.className = 'submission-result error';
                    resultDiv.textContent = `❌ ${error.error || 'Submission failed'}`;
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Solution';
                }
            } catch (err) {
                resultDiv.className = 'submission-result error';
                resultDiv.textContent = `❌ Network error: ${err.message}`;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Solution';
            }
        }

        let pollInterval = null;

        async function checkSubmissionStatus(submissionId) {
            try {
                const response = await fetch(`/api/submissions/${submissionId}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    const statusEl = document.getElementById('submissionStatus');
                    const verdictEl = document.getElementById('verdictText');
                    const submitBtn = document.getElementById('submitBtn');
                    
                    if (result.status === 'Completed' && result.verdict) {
                        statusEl.textContent = result.status;
                        const verdictColor = result.verdict === 'Accepted' ? '#28a745' : 
                                            result.verdict.includes('Error') ? '#dc3545' : '#ffc107';
                        verdictEl.innerHTML = `<strong style="color: ${verdictColor};">Verdict: ${result.verdict}</strong>`;
                        
                        // Stop polling once we have a verdict
                        if (pollInterval) {
                            clearInterval(pollInterval);
                            pollInterval = null;
                        }
                        
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Submit Solution';
                    } else {
                        statusEl.textContent = 'Pending';
                        verdictEl.textContent = 'Your solution is being evaluated...';
                    }
                }
            } catch (err) {
                console.error('Error checking status:', err);
            }
        }

        function pollSubmissionStatus(submissionId) {
            // Clear any existing polling
            if (pollInterval) {
                clearInterval(pollInterval);
            }
            
            // Check immediately
            checkSubmissionStatus(submissionId);
            
            // Then poll every 2 seconds for up to 30 seconds
            let attempts = 0;
            pollInterval = setInterval(() => {
                attempts++;
                if (attempts > 15) { // Stop after 30 seconds
                    clearInterval(pollInterval);
                    pollInterval = null;
                    const submitBtn = document.getElementById('submitBtn');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Solution';
                }
                checkSubmissionStatus(submissionId);
            }, 2000);
        }

        // Theme toggle functionality
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            const themeIcon = document.getElementById('themeIcon');
            
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeIcon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        }

        // Initialize theme from localStorage
        (function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const themeIcon = document.getElementById('themeIcon');
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (themeIcon) themeIcon.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        })();

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOMContentLoaded - Starting initialization');
            console.log('authToken:', authToken);
            loadProblem();
            
            if (authToken) {
                console.log('Token found, calling validateToken()');
                validateToken();
            } else {
                console.log('No token found, showing login required');
                showLoginRequired();
            }
        });
    </script>
</body>
