<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contests - CodeJudge</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* Page-specific styles */
        .filters { background: var(--card-bg); padding: 20px 24px; border-radius: 8px; margin-bottom: 24px; border: 1px solid var(--border-color); }
        .filter-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 16px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; transition: all 0.2s; }
        .filter-btn.active { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); }
        .filter-btn:hover { background: var(--bg-secondary); }
        .filter-btn.active:hover { background: var(--accent-hover); }
        .create-contest-btn { 
            padding: 8px 16px; 
            border: 1px solid var(--accent); 
            background: var(--accent); 
            color: var(--bg-primary); 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 13px; 
            letter-spacing: 0.5px;
            transition: all 0.2s; 
        }
        .create-contest-btn:hover { 
            background: var(--bg-primary); 
            color: var(--accent);
            transform: translateY(-1px);
        }
        .contests-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .contest-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 24px; border-radius: 8px; transition: all 0.2s; cursor: pointer; }
        .contest-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .contest-status { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 0.8em; font-weight: 600; margin-bottom: 12px; }
        .status-upcoming { background: #fef3c7; color: #92400e; }
        [data-theme="dark"] .status-upcoming { background: #78350f; color: #fef3c7; }
        .status-active { background: #d1fae5; color: #065f46; }
        [data-theme="dark"] .status-active { background: #064e3b; color: #d1fae5; }
        .status-finished { background: #e5e7eb; color: #374151; }
        [data-theme="dark"] .status-finished { background: #374151; color: #e5e7eb; }
        .contest-title { font-size: 1.25em; color: var(--text-primary); margin-bottom: 8px; font-weight: 600; }
        .contest-description { color: var(--text-secondary); margin-bottom: 16px; line-height: 1.5; font-size: 14px; }
        .contest-time { display: flex; flex-direction: column; gap: 6px; font-size: 0.875em; color: var(--text-secondary); }
        .contest-time span { display: flex; align-items: center; gap: 8px; }
        .time-label { font-weight: 600; color: var(--text-primary); }
        @media (max-width: 768px) { .contests-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="header-left">
                <a href="/" class="logo-link">
                    <img src="/logo.svg" alt="CodeJudge Logo" class="logo-icon">
                    <div class="logo-text">
                        <div class="logo-title">CodeJudge</div>
                    </div>
                </a>
            </div>
            <div class="header-right">
                <div class="nav-links">
                    <a href="/">Home</a>
                    <a href="/#problemsTab">Problems</a>
                    <a href="/admin.html" id="admin-link" style="display: none;">Admin</a>
                </div>
                <button class="create-contest-btn" id="create-contest-btn" style="display: none;">
                    Create Contest
                </button>
                <span id="userInfo"></span>
                <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        <div style="padding: 24px; background: var(--card-bg); margin: 24px; border-radius: 4px; border: 1px solid var(--border-color);">
            <h1 style="margin: 0 0 24px 0; font-size: 32px; font-weight: 600; letter-spacing: -1.5px;">Contests</h1>

            <div class="filters">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All Contests</button>
                    <button class="filter-btn" data-filter="upcoming">Upcoming</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="finished">Finished</button>
                </div>
            </div>

            <div id="error-container"></div>
            <div id="contests-container" class="loading">Loading contests...</div>
        </div>
    </div>

    <script>
        // Theme management
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const themeIcon = document.getElementById('themeIcon');
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (themeIcon) themeIcon.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            const themeIcon = document.getElementById('themeIcon');
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            if (themeIcon) themeIcon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        }

        initTheme();

        let allContests = [];
        let currentFilter = 'all';

        // Check if user is admin
        async function checkAdmin() {
            const token = localStorage.getItem('authToken');
            if (!token) return false;

            try {
                const response = await fetch('/api/auth/validate', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                if (response.ok) {
                    const claims = await response.json();
                    
                    // Display user info
                    const userInfoEl = document.getElementById('userInfo');
                    if (userInfoEl) {
                        userInfoEl.textContent = `👤 ${claims.username}`;
                        userInfoEl.style.display = 'inline-block';
                    }
                    
                    // Show admin features
                    if (claims.role === 'admin') {
                        document.getElementById('admin-link').style.display = 'inline';
                        document.getElementById('create-contest-btn').style.display = 'inline-block';
                        return true;
                    }
                }
            } catch (error) {
                console.error('Error checking admin status:', error);
            }
            return false;
        }

        // Load contests
        async function loadContests() {
            try {
                const response = await fetch('/api/contests');
                if (!response.ok) throw new Error('Failed to load contests');
                
                allContests = await response.json();
                displayContests();
            } catch (error) {
                document.getElementById('contests-container').innerHTML = `
                    <div class="error">Failed to load contests: ${error.message}</div>
                `;
            }
        }

        // Display contests based on filter
        function displayContests() {
            const container = document.getElementById('contests-container');
            
            let filtered = allContests;
            if (currentFilter !== 'all') {
                filtered = allContests.filter(c => c.status === currentFilter);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>No ${currentFilter === 'all' ? '' : currentFilter} contests found</h2>
                        <p>Check back later for new contests!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            container.className = 'contests-grid';

            filtered.forEach(contest => {
                const card = createContestCard(contest);
                container.appendChild(card);
            });
        }

        // Create contest card element
        function createContestCard(contest) {
            const card = document.createElement('div');
            card.className = 'contest-card';
            card.onclick = () => window.location.href = `/contest-detail.html?id=${contest.id}`;

            const startTime = new Date(contest.start_time).toLocaleString();
            const endTime = new Date(contest.end_time).toLocaleString();

            card.innerHTML = `
                <span class="contest-status status-${contest.status}">${contest.status.toUpperCase()}</span>
                <div class="contest-title">${escapeHtml(contest.title)}</div>
                <div class="contest-description">${escapeHtml(contest.description || 'No description')}</div>
                <div class="contest-time">
                    <span><span class="time-label">Start:</span> ${startTime}</span>
                    <span><span class="time-label">End:</span> ${endTime}</span>
                </div>
            `;

            return card;
        }

        // Set up filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                displayContests();
            });
        });

        // Create contest button
        document.getElementById('create-contest-btn').addEventListener('click', () => {
            window.location.href = '/create-contest.html';
        });

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        checkAdmin();
        loadContests();
    </script>
</body>
</html>
