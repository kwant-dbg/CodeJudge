<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contests - CodeJudge</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #fafafa;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --accent: #1a1a1a;
            --accent-hover: #333333;
            --card-bg: #ffffff;
        }
        
        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #282828;
            --text-primary: #eff1f6;
            --text-secondary: #a0a0a0;
            --border-color: #3a3a3a;
            --accent: #eff1f6;
            --accent-hover: #d0d0d0;
            --card-bg: #262626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0;
            line-height: 1.5;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 100%;
            margin: 0;
            padding: 0;
        }

        header {
            background: var(--card-bg);
            padding: 24px 32px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: var(--text-primary);
            font-size: 1.75em;
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            transition: background-color 0.2s;
            font-size: 14px;
        }

        .nav-links a:hover {
            background: var(--bg-secondary);
        }

        .main-content {
            padding: 32px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .filters {
            background: var(--card-bg);
            padding: 20px 24px;
            border-radius: 8px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .filter-btn:hover {
            background: var(--bg-secondary);
        }

        .filter-btn.active:hover {
            background: var(--accent-hover);
        }

        .contests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .contest-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .contest-card:hover {
            border-color: var(--accent);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .contest-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .status-upcoming {
            background: #fef3c7;
            color: #92400e;
        }

        [data-theme="dark"] .status-upcoming {
            background: #78350f;
            color: #fef3c7;
        }

        .status-active {
            background: #d1fae5;
            color: #065f46;
        }

        [data-theme="dark"] .status-active {
            background: #064e3b;
            color: #d1fae5;
        }

        .status-finished {
            background: #e5e7eb;
            color: #374151;
        }

        [data-theme="dark"] .status-finished {
            background: #374151;
            color: #e5e7eb;
        }

        .contest-title {
            font-size: 1.25em;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .contest-description {
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.5;
            font-size: 14px;
        }

        .contest-time {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.875em;
            color: var(--text-secondary);
        }

        .contest-time span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-label {
            font-weight: 600;
            color: var(--text-primary);
        }

        .create-contest-btn {
            background: var(--accent);
            color: var(--bg-primary);
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .create-contest-btn:hover {
            background: var(--accent-hover);
        }

        .empty-state {
            background: var(--card-bg);
            padding: 60px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .empty-state h2 {
            color: var(--text-primary);
            font-size: 1.5em;
            margin-bottom: 12px;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .loading {
            background: var(--card-bg);
            padding: 60px;
            border-radius: 8px;
            text-align: center;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .theme-toggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--bg-primary);
        }

        @media (max-width: 768px) {
            header {
                padding: 16px 20px;
            }

            .main-content {
                padding: 20px 16px;
            }

            h1 {
                font-size: 1.5em;
            }

            .contests-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Contests</h1>
            <div class="nav-links">
                <button class="theme-toggle" onclick="toggleTheme()">Toggle Dark Mode</button>
                <a href="index.html">Home</a>
                <a href="admin.html" id="admin-link" style="display: none;">Admin</a>
                <button class="create-contest-btn" id="create-contest-btn" style="display: none;">
                    Create Contest
                </button>
            </div>
        </header>

        <div class="main-content">
            <div class="filters">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All Contests</button>
                    <button class="filter-btn" data-filter="upcoming">Upcoming</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="finished">Finished</button>
                </div>
            </div>

            <div id="error-container"></div>
            <div id="contests-container" class="loading">Loading contests...</div>
        </div>
    </div>

    <script>
        // Theme management
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        initTheme();

        let allContests = [];
        let currentFilter = 'all';

        // Check if user is admin
        async function checkAdmin() {
            const token = localStorage.getItem('token');
            if (!token) return false;

            try {
                const response = await fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const user = await response.json();
                    if (user.role === 'admin') {
                        document.getElementById('admin-link').style.display = 'inline';
                        document.getElementById('create-contest-btn').style.display = 'inline-block';
                        return true;
                    }
                }
            } catch (error) {
                console.error('Error checking admin status:', error);
            }
            return false;
        }

        // Load contests
        async function loadContests() {
            try {
                const response = await fetch('/api/contests');
                if (!response.ok) throw new Error('Failed to load contests');
                
                allContests = await response.json();
                displayContests();
            } catch (error) {
                document.getElementById('contests-container').innerHTML = `
                    <div class="error">Failed to load contests: ${error.message}</div>
                `;
            }
        }

        // Display contests based on filter
        function displayContests() {
            const container = document.getElementById('contests-container');
            
            let filtered = allContests;
            if (currentFilter !== 'all') {
                filtered = allContests.filter(c => c.status === currentFilter);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>No ${currentFilter === 'all' ? '' : currentFilter} contests found</h2>
                        <p>Check back later for new contests!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            container.className = 'contests-grid';

            filtered.forEach(contest => {
                const card = createContestCard(contest);
                container.appendChild(card);
            });
        }

        // Create contest card element
        function createContestCard(contest) {
            const card = document.createElement('div');
            card.className = 'contest-card';
            card.onclick = () => window.location.href = `/contest-detail.html?id=${contest.id}`;

            const startTime = new Date(contest.start_time).toLocaleString();
            const endTime = new Date(contest.end_time).toLocaleString();

            card.innerHTML = `
                <span class="contest-status status-${contest.status}">${contest.status.toUpperCase()}</span>
                <div class="contest-title">${escapeHtml(contest.title)}</div>
                <div class="contest-description">${escapeHtml(contest.description || 'No description')}</div>
                <div class="contest-time">
                    <span><span class="time-label">Start:</span> ${startTime}</span>
                    <span><span class="time-label">End:</span> ${endTime}</span>
                </div>
            `;

            return card;
        }

        // Set up filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                displayContests();
            });
        });

        // Create contest button
        document.getElementById('create-contest-btn').addEventListener('click', () => {
            window.location.href = '/create-contest.html';
        });

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        checkAdmin();
        loadContests();
    </script>
</body>
</html>
